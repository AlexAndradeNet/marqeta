services:
  postgres:
    image: postgres:15-bullseye
    container_name: acceleratordb
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: acceleratordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - digitalbank_network

  coreapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: coreapp:latest
    container_name: coreapp
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - digitalbank_network
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/accelerator_db

networks:
  digitalbank_network:
    driver: bridge # Create the bridge network if it doesn't exist
    name: digitalbank_network # Force the network name to match the existing network created here

volumes:
  pgdata:
