services:

  marqetaapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: marqetaapp:latest
    container_name: marqetaapp
    restart: always
    ports:
      - "8081:8081"
    networks:
      - digitalbank_network
    environment:
      - CORE_API_URL=http://coreapp:8080

networks:
  digitalbank_network:
    external: true # Use the existing network created by core/docker-compose.yml
    name: digitalbank_network # Force the network name to match the existing network created by core/docker-compose.yml
