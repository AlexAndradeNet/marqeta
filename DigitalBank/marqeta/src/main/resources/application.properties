springdoc.api-docs.enabled=true
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
core.api.base-url=${CORE_API_URL:http://localhost:8080}
marqeta.api.base-url=${MARQETA_API_URL:https://sandbox-api.marqeta.com}
marqeta.application.user-token=${MARQETA_API_USERNAME}
marqeta.application.password-token=${MARQETA_API_PASSWORD}
management.endpoint.health.show-details=always
# Logging configuration
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.buffered=false
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
